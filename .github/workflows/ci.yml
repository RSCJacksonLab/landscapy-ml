name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANDSCAPY_REF: 3ebde77c93d587315251bf241680342ecb5f8230

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out landscapy-ml
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Run configured formatting and lint hooks
        run: python -m pre_commit run --all-files --show-diff-on-failure

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out landscapy-ml
        uses: actions/checkout@v4
      - name: Check out the audited Landscapy 0.9 source
        uses: actions/checkout@v4
        with:
          repository: RSCJacksonLab/landscapy
          ref: ${{ env.LANDSCAPY_REF }}
          path: .ci/landscapy
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .ci/landscapy/pyproject.toml
      - name: Install the primary package and adapter test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install .ci/landscapy
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify the absent GP-extra boundary
        run: |
          python -m pip uninstall --yes gpytorch linear-operator
          python - <<'PY'
          from landscapyml.examples import gp_fitness

          assert gp_fitness.gpytorch is None
          try:
              gp_fitness._load_gpytorch()
          except ImportError as exc:
              assert "requires gpytorch" in str(exc)
          else:
              raise AssertionError("gpytorch unexpectedly available in the base environment")
          PY
      - name: Run tests, documentation smoke checks, and coverage gate
        run: python -m pytest
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  optional-integrations:
    name: ${{ matrix.extra }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: graph
            test-file: tests/test_examples_gat_fitness.py
          - extra: gp
            test-file: tests/test_examples_gp_fitness.py
    steps:
      - name: Check out landscapy-ml
        uses: actions/checkout@v4
      - name: Check out the audited Landscapy 0.9 source
        uses: actions/checkout@v4
        with:
          repository: RSCJacksonLab/landscapy
          ref: ${{ env.LANDSCAPY_REF }}
          path: .ci/landscapy
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .ci/landscapy/pyproject.toml
      - name: Install optional integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install .ci/landscapy
          python -m pip install -e ".[dev,${{ matrix.extra }}]"
          python -m pip check
      - name: Run focused optional-integration tests
        run: python -m pytest --no-cov "${{ matrix.test-file }}"

  build:
    name: Build and installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out landscapy-ml
        uses: actions/checkout@v4
      - name: Check out the audited Landscapy 0.9 source
        uses: actions/checkout@v4
        with:
          repository: RSCJacksonLab/landscapy
          ref: ${{ env.LANDSCAPY_REF }}
          path: .ci/landscapy
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .ci/landscapy/pyproject.toml
      - name: Build and check release artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a fresh environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install .ci/landscapy
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -m pip check
      - name: Smoke-test installed public interfaces
        run: |
          .wheel-smoke/bin/python -c "import landscapyml; assert landscapyml.__version__ == '0.1.0'"
          .wheel-smoke/bin/python -m landscapyml --help
          .wheel-smoke/bin/python -m landscapyml list
          .wheel-smoke/bin/landscapy-ml --help
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: landscapy-ml-distributions
          path: dist/*
          if-no-files-found: error

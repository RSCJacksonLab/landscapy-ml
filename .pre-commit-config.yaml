minimum_pre_commit_version: "4.3.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check
        name: Ruff lint and import order
      - id: ruff-format
        name: Ruff format
        args: [--check]
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: NumPy pydocstyle
        files: ^src/landscapyml/.*\.py$
